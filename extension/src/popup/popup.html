<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepoLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🔍</span>
        <h1>RepoLens</h1>
      </div>
      <span class="version-badge">v0.1.0</span>
    </header>

    <main class="content">
      <div class="card status-card">
        <div class="status-header">
          <span id="status-indicator" class="status-indicator active"></span>
          <span class="status-title">Backend API</span>
        </div>
        <p id="backend-status" class="status-sub">Checking connection...</p>
      </div>

      <div class="card repo-card">
        <span class="card-label">Active Tab</span>
        <div id="repo-detected-info" class="repo-info">
          <p id="repo-name" class="repo-name">Scanning current tab...</p>
        </div>
      </div>

      <div class="card info-card">
        <p class="info-text">
          Navigate to any GitHub repository page and click <strong>"Preview Project"</strong> to trigger repository analysis.
        </p>
      </div>
    </main>

    <footer class="footer">
      <span>GitHub Visual Preview & Project Evaluation</span>
    </footer>
  </div>
  <script src="../../dist/popup.bundle.js"></script>
</body>
</html>
