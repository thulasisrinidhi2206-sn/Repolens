<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RepoLens</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="popup-container">
    <header class="header">
      <div class="logo">
        <span class="logo-icon">🔍</span>
        <h1>RepoLens</h1>
      </div>
      <span class="badge">v0.1.0</span>
    </header>

    <main class="content">
      <div class="status-card">
        <div class="status-indicator online"></div>
        <div class="status-text">
          <p class="status-label">Backend Status</p>
          <p id="backend-status" class="status-value">Checking connection...</p>
        </div>
      </div>

      <div class="info-card">
        <p class="info-text">
          Navigate to any GitHub repository to view live previews and project evaluations.
        </p>
      </div>

      <button id="check-status-btn" class="primary-button">
        Check Backend Connection
      </button>
    </main>

    <footer class="footer">
      <span>RepoLens Platform</span>
    </footer>
  </div>
  <script src="../../dist/popup/popup.js"></script>
</body>
</html>
